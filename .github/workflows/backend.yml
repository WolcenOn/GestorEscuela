name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://gestor:gestor@localhost:5432/gestor_escuela
      TEST_DATABASE_URL: postgresql+psycopg://gestor:gestor@localhost:5432/gestor_escuela

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gestor_escuela
          POSTGRES_USER: gestor
          POSTGRES_PASSWORD: gestor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestor -d gestor_escuela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Apply PostgreSQL migrations
        run: alembic upgrade head

      - name: Tests
        run: python -m pytest -m "not e2e"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Solver smoke test
        run: python simulate.py

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Start web application
        run: |
          PYTHONPATH=src python -m uvicorn gestor_escuela.web:app --host 127.0.0.1 --port 8000 > /tmp/gestor-escuela.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gestor-escuela.log
          exit 1

      - name: Playwright E2E
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: >-
          python -m pytest -m e2e --browser chromium
          --tracing=retain-on-failure --output=test-results

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
