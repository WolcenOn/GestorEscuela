name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://gestor:gestor@localhost:5432/gestor_escuela
      TEST_DATABASE_URL: postgresql+psycopg://gestor:gestor@localhost:5432/gestor_escuela

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gestor_escuela
          POSTGRES_USER: gestor
          POSTGRES_PASSWORD: gestor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestor -d gestor_escuela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Apply PostgreSQL migrations
        run: alembic upgrade head

      - name: Tests
        run: python -m pytest

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Solver smoke test
        run: python simulate.py
