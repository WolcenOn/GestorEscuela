services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestor_escuela
      POSTGRES_USER: gestor
      POSTGRES_PASSWORD: gestor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestor -d gestor_escuela"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - gestor_escuela_postgres:/var/lib/postgresql/data

volumes:
  gestor_escuela_postgres:
