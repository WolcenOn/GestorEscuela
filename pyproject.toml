[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gestor-escuela"
version = "0.2.0"
description = "Núcleo de optimización para organización y resiliencia escolar"
requires-python = ">=3.12"
dependencies = [
  "ortools>=9.11,<10",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "sqlalchemy>=2.0.43,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-playwright>=0.7,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "e2e: browser-based end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gestor_escuela"]
